<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salotto</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 24px; box-sizing: border-box; background: #0b0c10; color: #fff;
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .logo svg { width: 150px; height: auto; display: block; }
  h1 { font-size: 20px; font-weight: 500; margin: 0; max-width: 22em; }
  button { font: inherit; font-weight: 600; color: #181a1e; background: #fff; border: 0; border-radius: 14px;
    padding: 16px 28px; min-width: 240px; }
  button:disabled { opacity: .5; }
  #state { min-height: 1.4em; margin: 0; color: #e8cfc4; }
  input { display: none; }
</style>
</head>
<body>
<div class="logo">{{logo}}</div>
<h1>{{title}}</h1>
<button id="pick" type="button">{{pick}}</button>
<input id="file" type="file" accept="image/*">
<p id="state" data-sending="{{sending}}" data-sent="{{sent}}" data-failed="{{failed}}"></p>
<script>
  // Resized here to 4K at most, as JPEG: the phone's photo, HEIC included, arrives as something the TV can read.
  const MOST = 3840;
  const pick = document.getElementById('pick');
  const file = document.getElementById('file');
  const state = document.getElementById('state');
  pick.onclick = () => file.click();
  file.onchange = async () => {
    const chosen = file.files[0];
    if (!chosen) return;
    pick.disabled = true;
    state.textContent = state.dataset.sending;
    try {
      const picture = new Image();
      picture.src = URL.createObjectURL(chosen);
      await picture.decode();
      const scale = Math.min(1, MOST / Math.max(picture.naturalWidth, picture.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(picture.naturalWidth * scale);
      canvas.height = Math.round(picture.naturalHeight * scale);
      canvas.getContext('2d').drawImage(picture, 0, 0, canvas.width, canvas.height);
      const jpeg = await new Promise(done => canvas.toBlob(done, 'image/jpeg', 0.9));
      const answer = await fetch('carica', { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: jpeg });
      if (!answer.ok) throw new Error(answer.status);
      state.textContent = state.dataset.sent;
      setTimeout(() => location.reload(), 1500);
    } catch (error) {
      state.textContent = state.dataset.failed;
      pick.disabled = false;
      file.value = '';
    }
  };
</script>
</body>
</html>
