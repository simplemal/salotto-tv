// With -Pfirma, signs with the final key instead of the development one. The build stays debuggable:
// the way back to the previous version installs with `pm install -d`, which works only on those.
// The key stays out of Git, in chiavi-aggiornamento/. See distro/docs/RILASCIO.md.
if (project.hasProperty('firma')) {
    def folder = rootProject.file('../chiavi-aggiornamento')
    def file = new File(folder, 'firma.properties')
    if (!file.exists()) throw new GradleException("Manca ${file}: la firma definitiva non è su questo computer.")
    def firma = new Properties()
    file.withInputStream { firma.load(it) }
    android {
        signingConfigs {
            definitiva {
                storeFile new File(folder, firma.getProperty('storeFile'))
                storePassword firma.getProperty('password')
                keyAlias firma.getProperty('keyAlias')
                keyPassword firma.getProperty('password')
            }
        }
        buildTypes { debug { signingConfig signingConfigs.definitiva } }
    }
}
