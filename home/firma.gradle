// Signs with the final key when it is on this computer, with the development one otherwise: the
// two cannot update each other, so choosing by hand would be one forgotten flag away from a broken
// release. The build stays debuggable: the way back to the previous version installs with
// `pm install -d`, which works only on those. The key stays out of Git, in chiavi-aggiornamento/.
// See distro/docs/RILASCIO.md.
def folder = rootProject.file('../chiavi-aggiornamento')
def file = new File(folder, 'firma.properties')
if (file.exists()) {
    def firma = new Properties()
    file.withInputStream { firma.load(it) }
    android {
        signingConfigs {
            definitiva {
                storeFile new File(folder, firma.getProperty('storeFile'))
                storePassword firma.getProperty('password')
                keyAlias firma.getProperty('keyAlias')
                keyPassword firma.getProperty('password')
            }
        }
        buildTypes { debug { signingConfig signingConfigs.definitiva } }
    }
}
